[custom]
; 基于 ../Clash/config/ACL4SSR_Online_Full_NoAuto.ini，ACL4SSR / CC-BY-SA-4.0。
; 保留原版服务分类；新增刷帖、Steam、TikTok、谷歌服务、Github、Twitter。
; 港、美、日使用现有节点；AI 服务、Twitter 默认美国，刷帖默认香港，TikTok 默认日本。
; 所有分组手动选择；无节点凭据。修改后运行 python Personal/build.py。

; 个人域名优先于通用规则；在这里增加论坛，再重新生成两端模板。
ruleset=📰 刷帖,[]DOMAIN-SUFFIX,nodeseek.com
ruleset=📰 刷帖,[]DOMAIN-SUFFIX,v2ex.com
ruleset=📰 刷帖,[]DOMAIN-SUFFIX,linux.do
; Shunt_Rules 远程规则：Twitter 单独分组，Claude 并入 AI 服务，两组默认都是美国。
; 该仓库的 .lsr 是纯文本规则（IP-CIDR 带 no-resolve、DOMAIN-KEYWORD、DOMAIN-SUFFIX），
; Mihomo 按 classical 文本规则集读取，Loon 按远程规则读取，两端共用同一份来源。
ruleset=🐦 Twitter,https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Loon/Twitter.lsr
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/Keviin560/Shunt_Rules/main/rule/Loon/Claude.lsr
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
; AI 优先于 UnBan、微软、Google、Github，保留共享认证域名的原规则覆盖。
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
